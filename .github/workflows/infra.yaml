
name: Azure Infrastructure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      # Azure OIDC Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      # Verify Azure connection
      - name: Verify Azure
        run: |
          az account show

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform
      - name: Terraform Version
        run: |
          terraform version

      # Initialize Terraform
      - name: Terraform Init
        run: |
          terraform init

      # Terraform Plan
      - name: Terraform Plan
        run: |
          terraform plan

      # Terraform Apply
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve

