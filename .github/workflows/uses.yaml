name: My First GitHub Actions Pipeline
on:
  push:
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Say Hello
        run: echo "Hello from GitHub Actions"
      - name: Show current directory
        run: pwd
      - name: List files
        run: ls -la
      - name: Show runner OS
        run: uname -a
